<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="300">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rosticcerie">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta property="og:title" content="Rosticcerie">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sebastiano-mazzarisi.github.io/Rosticcerie/output/rosticceria_ios/Rosticcerie.html">
  <meta property="og:image" content="https://sebastiano-mazzarisi.github.io/Rosticcerie/output/rosticceria_ios/apple-touch-icon.png">
  <title>Rosticcerie</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    /* Fascia nera superiore */
    header {
      background: #000;
      padding: 18px 16px;
      border-bottom: 1px solid #333;
      position: sticky;
      top: 0;
      z-index: 100;
      text-align: center;
    }
    h1#main-title {
      margin: 0;
      font-size: 32px;
      color: #007bff; /* Azzurro */
      cursor: pointer;
    }
    .updated {
      margin: 4px 0 0;
      color: #ccc;
      font-size: 14px;
    }
    /* Nome + telefono mostrati sopra all'immagine nel dettaglio */
    #phone-line {
      display: none;
      text-align: center;
      padding: 10px 16px 0;
    }
    #phone-line a {
      color: #00c853;
      font-size: 20px;
      font-weight: bold;
      text-decoration: none;
    }
    /* Griglia dei bottoni iniziali: distanziati di 10px tra loro e dai margini */
    main {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      padding: 10px;
      box-sizing: border-box;
    }
    .card {
      position: relative;
      appearance: none;
      -webkit-appearance: none;
      font: inherit;
      background: #fff7de; /* Sostituito inline per riga: verde/giallo tenue */
      box-sizing: border-box;
      cursor: pointer;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12px;
      border: 4px solid #ffd641; /* Verde intenso se aggiornata oggi, giallo intenso altrimenti */
      border-radius: 12px;
    }
    .card .card-name {
      font-size: clamp(16px, 5vw, 26px);
      color: #111; /* Nomi neri */
      font-weight: bold;
    }
    .card-counter {
      display: none;
      position: absolute;
      bottom: 4px;
      right: 8px;
      font-size: 11px;
      font-weight: normal;
      color: #555;
    }
    .error {
      color: #ffd0d0;
      font-size: 16px;
      text-align: center;
      padding: 20px;
    }

    /* Layout per monitor normali/piccoli */
    @media (max-width: 1200px) {
      main {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    /* Dettaglio a tutto schermo */
    #detail-view {
      display: none;
      padding-bottom: 85px; /* Spazio per la fascia con le frecce */
    }
    #detail-content {
      padding: 12px;
      cursor: pointer; /* Toccare l'immagine (o il messaggio) torna all'elenco */
    }
    #detail-content img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* Su schermi da PC la foto occupa circa un terzo della larghezza
       (equivalente a 3 colonne), invece di riempire tutto lo schermo. */
    @media (min-width: 900px) {
      #detail-content img {
        width: 33%;
      }
    }

    /* Fascia nera inferiore con le frecce di navigazione */
    #nav-bar {
      display: none;
      background: #000;
      padding: 14px 24px;
      align-items: center;
      justify-content: space-between;
      position: fixed;
      bottom: 0;
      width: 100%;
      z-index: 100;
      border-top: 1px solid #333;
      box-sizing: border-box;
    }
    #nav-bar button {
      appearance: none;
      -webkit-appearance: none;
      background: none;
      border: none;
      color: #fff;
      font-size: 30px;
      line-height: 1;
      padding: 6px 24px;
      cursor: pointer;
    }
  </style>
  <script>
    const PANELS = [{"name": "Fantasia", "phone_display": "080-405.41.39", "phone_tel": "0804054139", "image": "Fantasia.jpg?v=1788602026", "error": "", "updated": true, "url": "https://www.facebook.com/RosticceriaFantasia"}, {"name": "Cibària", "phone_display": "080-645.07.99", "phone_tel": "0806450799", "image": "Cibaria.jpg?v=1788602026", "error": "", "updated": true, "url": "https://www.facebook.com/cibaria.asporto"}, {"name": "Impastamò", "phone_display": "392-536.15.36", "phone_tel": "3925361536", "image": "Impastamo.jpg?v=1788602026", "error": "", "updated": false, "url": "https://www.facebook.com/profile.php?id=61560452176728"}, {"name": "Le delizie di Michela", "phone_display": "080-521.22.33", "phone_tel": "0805212233", "image": "Le_delizie_di_Michela.jpg?v=1788602026", "error": "", "updated": true, "url": "https://www.facebook.com/profile.php?id=100045208848338"}, {"name": "Santoro (Castellana)", "phone_display": "080-859.83.13", "phone_tel": "0808598313", "image": "Santoro__Castellana.jpg?v=1788602026", "error": "", "updated": true, "url": "https://www.facebook.com/santorogastronomia"}, {"name": "Pane&Co", "phone_display": "080-405.49.00", "phone_tel": "0804054900", "image": "Pane_Co.jpg?v=1788602026", "error": "", "updated": true, "url": "https://www.paneeco.it/menu"}, {"name": "Bollenti piatti", "phone_display": "334-318.58.44", "phone_tel": "3343185844", "image": "Bollenti_piatti.jpg?v=1788602026", "error": "", "updated": true, "url": "https://www.facebook.com/BollentiPiatti"}];
    let currentIndex = -1;

    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.get('v') === '57';
    // Uso un'API globale gratuita per il contatore, un contatore separato per ogni rosticceria
    const ABACUS_BASE = 'https://abacus.jasoncameron.dev';
    const COUNTER_NAMESPACE = 'rosticcerie-fantasia';

    function slugify(s) {
        return s.normalize('NFD').replace(/[̀-ͯ]/g, '')
            .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    }
    function counterKeyFor(name) { return 'menu-views-' + slugify(name); }
    function offsetKeyFor(name) { return 'menu-views-offset-' + slugify(name); }
    function counterGetUrlFor(name) { return ABACUS_BASE + '/get/' + COUNTER_NAMESPACE + '/' + counterKeyFor(name); }
    function counterHitUrlFor(name) { return ABACUS_BASE + '/hit/' + COUNTER_NAMESPACE + '/' + counterKeyFor(name); }
    function offsetGetUrlFor(name) { return ABACUS_BASE + '/get/' + COUNTER_NAMESPACE + '/' + offsetKeyFor(name); }
    function offsetHitUrlFor(name) { return ABACUS_BASE + '/hit/' + COUNTER_NAMESPACE + '/' + offsetKeyFor(name); }

    function fetchWithRetry(url, attempts) {
        return fetch(url).catch(err => {
            if (attempts > 1) {
                return new Promise(resolve => setTimeout(resolve, 800)).then(() => fetchWithRetry(url, attempts - 1));
            }
            throw err;
        });
    }

    let totalClicksByPanel = [];
    let offsetClicksByPanel = [];

    function loadCounter() {
        if (isAdmin) {
            // L'offset di azzeramento e' condiviso (salvato su Abacus), non solo sul dispositivo
            const tasks = PANELS.map((p, i) => Promise.all([
                fetchWithRetry(counterGetUrlFor(p.name), 3).then(r => r.json()),
                fetchWithRetry(offsetGetUrlFor(p.name), 3).then(r => r.json())
            ]).then(([totalData, offsetData]) => {
                totalClicksByPanel[i] = totalData.value || 0;
                offsetClicksByPanel[i] = offsetData.value || 0;
            }));
            Promise.all(tasks).then(() => {
                updateAdminTitle();
                updateCardCounters();
            }).catch(e => console.error(e));
        }
    }

    async function resetCounterGlobally() {
        const mainTitle = document.getElementById('main-title');
        mainTitle.innerText = 'Azzeramento in corso...';
        try {
            for (let i = 0; i < PANELS.length; i++) {
                const p = PANELS[i];
                const totalData = await fetchWithRetry(counterGetUrlFor(p.name), 3).then(r => r.json());
                const target = totalData.value || 0;
                let offsetData = await fetchWithRetry(offsetGetUrlFor(p.name), 3).then(r => r.json());
                let current = offsetData.value || 0;
                while (current < target) {
                    await fetchWithRetry(offsetHitUrlFor(p.name), 3);
                    current++;
                }
                totalClicksByPanel[i] = target;
                offsetClicksByPanel[i] = current;
            }
        } catch (e) {
            console.error(e);
        }
        updateAdminTitle();
        updateCardCounters();
    }

    function updateAdminTitle() {
        let val = 0;
        for (let i = 0; i < PANELS.length; i++) {
            val += Math.max(0, (totalClicksByPanel[i] || 0) - (offsetClicksByPanel[i] || 0));
        }
        document.getElementById('main-title').innerText = `Rosticcerie (${val.toLocaleString('it-IT')})`;
    }

    function updateCardCounters() {
        if (!isAdmin) return;
        for (let i = 0; i < PANELS.length; i++) {
            const el = document.getElementById('card-counter-' + i);
            if (!el) continue;
            const val = Math.max(0, (totalClicksByPanel[i] || 0) - (offsetClicksByPanel[i] || 0));
            el.innerText = val.toLocaleString('it-IT');
            el.style.display = 'block';
        }
    }

    function renderDetail(i) {
        const n = PANELS.length;
        currentIndex = ((i % n) + n) % n;
        const p = PANELS[currentIndex];

        document.getElementById('main-title').innerText = p.name;
        document.getElementById('main-updated').style.display = 'none';

        const phoneLine = document.getElementById('phone-line');
        if (p.phone_tel) {
            phoneLine.innerHTML = '<a href="tel:' + p.phone_tel + '" onclick="event.stopPropagation()">' + p.phone_display + '</a>';
            phoneLine.style.display = 'block';
        } else {
            phoneLine.innerHTML = '';
            phoneLine.style.display = 'none';
        }

        const content = document.getElementById('detail-content');
        if (p.image) {
            content.innerHTML = '<img src="' + p.image + '" alt="' + p.name + '">';
        } else {
            content.innerHTML = '<p class="error">' + (p.error || 'Menu non disponibile.') + '</p>';
        }
    }

    function openDetail(i) {
        document.getElementById('grid-view').style.display = 'none';

        renderDetail(i);
        document.getElementById('detail-view').style.display = 'block';
        document.getElementById('nav-bar').style.display = 'flex';
        window.scrollTo(0, 0);

        if (!isAdmin) {
            const p = PANELS[currentIndex];
            fetchWithRetry(counterHitUrlFor(p.name), 3).catch(e => {});
        }
    }

    function showPrev() { renderDetail(currentIndex - 1); }
    function showNext() { renderDetail(currentIndex + 1); }

    function closeDetail() {
        document.getElementById('detail-view').style.display = 'none';
        document.getElementById('phone-line').style.display = 'none';
        document.getElementById('nav-bar').style.display = 'none';
        document.getElementById('grid-view').style.display = 'grid';
        document.getElementById('main-updated').style.display = '';

        const mainTitle = document.getElementById('main-title');
        if (isAdmin) {
            updateAdminTitle();
        } else {
            mainTitle.innerText = 'Rosticcerie';
        }

        window.scrollTo(0, 0);
    }

    function handleTitleClick() {
        const inDetail = document.getElementById('grid-view').style.display === 'none';
        if (inDetail) {
            const p = PANELS[currentIndex];
            if (p && p.url) {
                window.open(p.url, '_blank', 'noopener');
            }
            return;
        }
        if (isAdmin) {
            if (confirm("Vuoi davvero azzerare il contatore? (Verra' azzerato per tutti i dispositivi)")) {
                resetCounterGlobally();
            }
        }
    }

    window.onload = loadCounter;
  </script>
</head>
<body>
  <header id="main-header">
    <h1 id="main-title" onclick="handleTitleClick()">Rosticcerie</h1>
    <div id="phone-line"></div>
    <p id="main-updated" class="updated">Sabato 5 settembre</p>
  </header>

  <main id="grid-view">
    
        <button type="button" class="card" style="border-color:#00c853;background-color:#e3f8ea" onclick="openDetail(0)">
            <span class="card-name">Fantasia</span>
            <span class="card-counter" id="card-counter-0"></span>
        </button>
        
        <button type="button" class="card" style="border-color:#00c853;background-color:#e3f8ea" onclick="openDetail(1)">
            <span class="card-name">Cibària</span>
            <span class="card-counter" id="card-counter-1"></span>
        </button>
        
        <button type="button" class="card" style="border-color:#ffd641;background-color:#fff7de" onclick="openDetail(2)">
            <span class="card-name">Impastamò</span>
            <span class="card-counter" id="card-counter-2"></span>
        </button>
        
        <button type="button" class="card" style="border-color:#00c853;background-color:#e3f8ea" onclick="openDetail(3)">
            <span class="card-name">Le delizie di Michela</span>
            <span class="card-counter" id="card-counter-3"></span>
        </button>
        
        <button type="button" class="card" style="border-color:#00c853;background-color:#e3f8ea" onclick="openDetail(4)">
            <span class="card-name">Santoro (Castellana)</span>
            <span class="card-counter" id="card-counter-4"></span>
        </button>
        
        <button type="button" class="card" style="border-color:#00c853;background-color:#e3f8ea" onclick="openDetail(5)">
            <span class="card-name">Pane&amp;Co</span>
            <span class="card-counter" id="card-counter-5"></span>
        </button>
        
        <button type="button" class="card" style="border-color:#00c853;background-color:#e3f8ea" onclick="openDetail(6)">
            <span class="card-name">Bollenti piatti</span>
            <span class="card-counter" id="card-counter-6"></span>
        </button>
        
  </main>

  <div id="detail-view">
    <div id="detail-content" onclick="closeDetail()"></div>
  </div>

  <div id="nav-bar">
    <button type="button" onclick="showPrev()" aria-label="Rosticceria precedente">&#8592;</button>
    <button type="button" onclick="showNext()" aria-label="Rosticceria successiva">&#8594;</button>
  </div>
</body>
</html>
