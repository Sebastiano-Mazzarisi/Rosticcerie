<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="300">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rosticcerie">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta property="og:title" content="Rosticcerie">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sebastiano-mazzarisi.github.io/Rosticcerie/output/rosticceria_ios/Rosticcerie.html">
  <meta property="og:image" content="https://sebastiano-mazzarisi.github.io/Rosticcerie/output/rosticceria_ios/apple-touch-icon.png">
  <title>Rosticcerie</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    /* Fascia nera superiore */
    header {
      background: #000;
      padding: 18px 16px;
      border-bottom: 1px solid #333;
      position: sticky;
      top: 0;
      z-index: 100;
      text-align: center;
    }
    h1#main-title {
      margin: 0;
      font-size: 32px;
      color: #007bff; /* Azzurro */
      cursor: pointer;
    }
    .updated {
      margin: 4px 0 0;
      color: #ccc;
      font-size: 14px;
    }
    /* Nome + telefono mostrati sopra all'immagine nel dettaglio */
    #phone-line {
      display: none;
      text-align: center;
      padding: 10px 16px 0;
    }
    #phone-line a {
      color: #00c853;
      font-size: 20px;
      font-weight: bold;
      text-decoration: none;
    }
    /* Griglia dei bottoni iniziali: distanziati di 10px tra loro e dai margini */
    main {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      padding: 10px;
      box-sizing: border-box;
    }
    .card {
      appearance: none;
      -webkit-appearance: none;
      font: inherit;
      background: #fff7de; /* Sostituito inline per riga: verde/giallo tenue */
      box-sizing: border-box;
      cursor: pointer;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12px;
      border: 4px solid #ffd641; /* Verde intenso se aggiornata oggi, giallo intenso altrimenti */
      border-radius: 12px;
    }
    .card span {
      font-size: clamp(16px, 5vw, 26px);
      color: #111; /* Nomi neri */
      font-weight: bold;
    }
    .error {
      color: #ffd0d0;
      font-size: 16px;
      text-align: center;
      padding: 20px;
    }

    /* Layout per monitor normali/piccoli */
    @media (max-width: 1200px) {
      main {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    /* Dettaglio a tutto schermo */
    #detail-view {
      display: none;
      padding-bottom: 85px; /* Spazio per la fascia con le frecce */
    }
    #detail-content {
      padding: 12px;
      cursor: pointer; /* Toccare l'immagine (o il messaggio) torna all'elenco */
    }
    #detail-content img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* Fascia nera inferiore con le frecce di navigazione */
    #nav-bar {
      display: none;
      background: #000;
      padding: 14px 24px;
      align-items: center;
      justify-content: space-between;
      position: fixed;
      bottom: 0;
      width: 100%;
      z-index: 100;
      border-top: 1px solid #333;
      box-sizing: border-box;
    }
    #nav-bar button {
      appearance: none;
      -webkit-appearance: none;
      background: none;
      border: none;
      color: #fff;
      font-size: 30px;
      line-height: 1;
      padding: 6px 24px;
      cursor: pointer;
    }
  </style>
  <script>
    const PANELS = [{"name": "Fantasia", "phone_display": "080-405.41.39", "phone_tel": "0804054139", "image": "Fantasia.jpg?v=1788537696", "error": "", "updated": true}, {"name": "Cibària", "phone_display": "080-645.07.99", "phone_tel": "0806450799", "image": "Cibaria.jpg?v=1788537696", "error": "", "updated": true}, {"name": "Impastamò", "phone_display": "392-536.15.36", "phone_tel": "3925361536", "image": "Impastamo.jpg?v=1788537696", "error": "", "updated": false}, {"name": "Le delizie di Michela", "phone_display": "080-521.22.33", "phone_tel": "0805212233", "image": "Le_delizie_di_Michela.jpg?v=1788537696", "error": "", "updated": false}, {"name": "Santoro (Castellana)", "phone_display": "080-859.83.13", "phone_tel": "0808598313", "image": "Santoro__Castellana.jpg?v=1788537696", "error": "", "updated": true}, {"name": "Pane&Co", "phone_display": "080-405.49.00", "phone_tel": "0804054900", "image": "Pane_Co.jpg?v=1788537696", "error": "", "updated": true}, {"name": "Bollenti piatti", "phone_display": "334-318.58.44", "phone_tel": "3343185844", "image": "", "error": "Non ho trovato nessun post testuale del menu nella pagina Facebook: https://www.facebook.com/BollentiPiatti", "updated": false}];
    let currentIndex = -1;

    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.get('v') === '57';
    // Uso un'API globale gratuita per il contatore
    const ABACUS_BASE = 'https://abacus.jasoncameron.dev';
    const COUNTER_NAMESPACE = 'rosticcerie-fantasia';
    const COUNTER_KEY = 'menu-views';
    const counterGetUrl = ABACUS_BASE + '/get/' + COUNTER_NAMESPACE + '/' + COUNTER_KEY;
    const counterHitUrl = ABACUS_BASE + '/hit/' + COUNTER_NAMESPACE + '/' + COUNTER_KEY;
    const OFFSET_KEY = 'menu-views-offset';
    const offsetGetUrl = ABACUS_BASE + '/get/' + COUNTER_NAMESPACE + '/' + OFFSET_KEY;
    const offsetHitUrl = ABACUS_BASE + '/hit/' + COUNTER_NAMESPACE + '/' + OFFSET_KEY;
    function fetchWithRetry(url, attempts) {
        return fetch(url).catch(err => {
            if (attempts > 1) {
                return new Promise(resolve => setTimeout(resolve, 800)).then(() => fetchWithRetry(url, attempts - 1));
            }
            throw err;
        });
    }

    let totalClicks = 0;
    let offsetClicks = 0;

    function loadCounter() {
        if (isAdmin) {
            // L'offset di azzeramento e' condiviso (salvato su Abacus), non solo sul dispositivo
            Promise.all([
                fetchWithRetry(counterGetUrl, 3).then(r => r.json()),
                fetchWithRetry(offsetGetUrl, 3).then(r => r.json())
            ]).then(([totalData, offsetData]) => {
                totalClicks = totalData.value || 0;
                offsetClicks = offsetData.value || 0;
                updateAdminTitle();
            }).catch(e => console.error(e));
        }
    }

    async function resetCounterGlobally() {
        const mainTitle = document.getElementById('main-title');
        mainTitle.innerText = 'Azzeramento in corso...';
        try {
            const totalData = await fetchWithRetry(counterGetUrl, 3).then(r => r.json());
            const target = totalData.value || 0;
            let offsetData = await fetchWithRetry(offsetGetUrl, 3).then(r => r.json());
            let current = offsetData.value || 0;
            while (current < target) {
                await fetchWithRetry(offsetHitUrl, 3);
                current++;
            }
            totalClicks = target;
            offsetClicks = current;
        } catch (e) {
            console.error(e);
        }
        updateAdminTitle();
    }

    function updateAdminTitle() {
        let val = Math.max(0, totalClicks - offsetClicks);
        document.getElementById('main-title').innerText = `Rosticcerie (${val.toLocaleString('it-IT')})`;
    }

    function renderDetail(i) {
        const n = PANELS.length;
        currentIndex = ((i % n) + n) % n;
        const p = PANELS[currentIndex];

        document.getElementById('main-title').innerText = p.name;

        const phoneLine = document.getElementById('phone-line');
        if (p.phone_tel) {
            phoneLine.innerHTML = '<a href="tel:' + p.phone_tel + '" onclick="event.stopPropagation()">' + p.phone_display + '</a>';
            phoneLine.style.display = 'block';
        } else {
            phoneLine.innerHTML = '';
            phoneLine.style.display = 'none';
        }

        const content = document.getElementById('detail-content');
        if (p.image) {
            content.innerHTML = '<img src="' + p.image + '" alt="' + p.name + '">';
        } else {
            content.innerHTML = '<p class="error">' + (p.error || 'Menu non disponibile.') + '</p>';
        }
    }

    function openDetail(i) {
        document.getElementById('grid-view').style.display = 'none';

        renderDetail(i);
        document.getElementById('detail-view').style.display = 'block';
        document.getElementById('nav-bar').style.display = 'flex';
        window.scrollTo(0, 0);

        if (!isAdmin) {
            fetchWithRetry(counterHitUrl, 3).catch(e => {});
        }
    }

    function showPrev() { renderDetail(currentIndex - 1); }
    function showNext() { renderDetail(currentIndex + 1); }

    function closeDetail() {
        document.getElementById('detail-view').style.display = 'none';
        document.getElementById('phone-line').style.display = 'none';
        document.getElementById('nav-bar').style.display = 'none';
        document.getElementById('grid-view').style.display = 'grid';

        const mainTitle = document.getElementById('main-title');
        if (isAdmin) {
            updateAdminTitle();
        } else {
            mainTitle.innerText = 'Rosticcerie';
        }

        window.scrollTo(0, 0);
    }

    function handleTitleClick() {
        if (isAdmin && document.getElementById('grid-view').style.display !== 'none') {
            if (confirm("Vuoi davvero azzerare il contatore? (Verra' azzerato per tutti i dispositivi)")) {
                resetCounterGlobally();
            }
        }
    }

    window.onload = loadCounter;
  </script>
</head>
<body>
  <header id="main-header">
    <h1 id="main-title" onclick="handleTitleClick()">Rosticcerie</h1>
    <p id="main-updated" class="updated">Aggiornato: 04/09/2026 16:01</p>
  </header>

  <div id="phone-line"></div>

  <main id="grid-view">
    
        <button type="button" class="card" style="border-color:#00c853;background-color:#e3f8ea" onclick="openDetail(0)">
            <span>Fantasia</span>
        </button>
        
        <button type="button" class="card" style="border-color:#00c853;background-color:#e3f8ea" onclick="openDetail(1)">
            <span>Cibària</span>
        </button>
        
        <button type="button" class="card" style="border-color:#ffd641;background-color:#fff7de" onclick="openDetail(2)">
            <span>Impastamò</span>
        </button>
        
        <button type="button" class="card" style="border-color:#ffd641;background-color:#fff7de" onclick="openDetail(3)">
            <span>Le delizie di Michela</span>
        </button>
        
        <button type="button" class="card" style="border-color:#00c853;background-color:#e3f8ea" onclick="openDetail(4)">
            <span>Santoro (Castellana)</span>
        </button>
        
        <button type="button" class="card" style="border-color:#00c853;background-color:#e3f8ea" onclick="openDetail(5)">
            <span>Pane&amp;Co</span>
        </button>
        
        <button type="button" class="card" style="border-color:#ffd641;background-color:#fff7de" onclick="openDetail(6)">
            <span>Bollenti piatti</span>
        </button>
        
  </main>

  <div id="detail-view">
    <div id="detail-content" onclick="closeDetail()"></div>
  </div>

  <div id="nav-bar">
    <button type="button" onclick="showPrev()" aria-label="Rosticceria precedente">&#8592;</button>
    <button type="button" onclick="showNext()" aria-label="Rosticceria successiva">&#8594;</button>
  </div>
</body>
</html>
