<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="300">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rosticcerie">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Rosticcerie</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    /* Fascia nera superiore */
    header {
      background: #000;
      padding: 18px 16px;
      border-bottom: 1px solid #333;
      position: sticky;
      top: 0;
      z-index: 100;
      text-align: center;
    }
    h1#main-title {
      margin: 0;
      font-size: 32px;
      color: #007bff; /* Blu */
      cursor: pointer;
    }
    .updated {
      margin: 4px 0 0;
      color: #ccc;
      font-size: 14px;
    }
    /* Ripristinato il layout a più colonne */
    main {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1px;
      background: #333;
    }
    .card {
      background: #111;
      box-sizing: border-box;
      cursor: pointer;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12px;
    }
    .card-detail-content {
      display: none; /* Nella griglia si vede solo il nome */
    }
    .card h2 {
      margin: 0;
      font-size: clamp(16px, 5vw, 26px);
      color: #ffcc00; /* Colore giallo per i titoli come nell'originale */
    }
    .error {
      color: #ffd0d0;
      font-size: 16px;
    }
    
    /* Layout per monitor normali/piccoli */
    @media (max-width: 1200px) {
      main {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    /* Dettaglio a tutto schermo */
    #detail-view {
      display: none;
      padding: 12px;
      padding-bottom: 85px; /* Spazio per la fascia Home */
    }
    #detail-view h2 {
      display: none; /* Il nome e' gia' mostrato nella fascia superiore */
    }
    #detail-view .card-detail-content {
      display: block; /* Nel dettaglio si vede solo l'immagine (tutto e' dentro l'immagine) */
    }
    #detail-view img {
      max-width: 100%;
      height: auto;
      display: block;
    }
    #detail-view a {
      display: block;
    }
    
    /* Fascia nera inferiore */
    footer {
      display: none;
      background: #000;
      padding: 18px 16px;
      text-align: center;
      position: fixed;
      bottom: 0;
      width: 100%;
      z-index: 100;
      cursor: pointer;
      border-top: 1px solid #333;
      box-sizing: border-box;
    }
    footer h1 {
      margin: 0;
      font-size: 30px;
      color: #fff;
    }
  </style>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.get('v') === '57';
    // Uso un'API globale gratuita per il contatore
    const ABACUS_BASE = 'https://abacus.jasoncameron.dev';
    const COUNTER_NAMESPACE = 'rosticcerie-fantasia';
    const COUNTER_KEY = 'menu-views';
    const counterGetUrl = ABACUS_BASE + '/get/' + COUNTER_NAMESPACE + '/' + COUNTER_KEY;
    const counterHitUrl = ABACUS_BASE + '/hit/' + COUNTER_NAMESPACE + '/' + COUNTER_KEY;
    const OFFSET_KEY = 'menu-views-offset';
    const offsetGetUrl = ABACUS_BASE + '/get/' + COUNTER_NAMESPACE + '/' + OFFSET_KEY;
    const offsetHitUrl = ABACUS_BASE + '/hit/' + COUNTER_NAMESPACE + '/' + OFFSET_KEY;
    function fetchWithRetry(url, attempts) {
        return fetch(url).catch(err => {
            if (attempts > 1) {
                return new Promise(resolve => setTimeout(resolve, 800)).then(() => fetchWithRetry(url, attempts - 1));
            }
            throw err;
        });
    }
    const PHONE_NUMBERS = {"Fantasia": "080-405.41.39", "Cibarìa": "080-645.07.99", "Impastamò": "392-536.15.36", "Le delizie di Michela": "080-521.22.33", "Santoro (Castellana)": "080-859.83.13", "Pane&Co": "080-405.49.00", "Bollenti piatti": "334-318.58.44"};
    
    let totalClicks = 0;
    let offsetClicks = 0;
    
    function loadCounter() {
        if (isAdmin) {
            // L'offset di azzeramento e' condiviso (salvato su Abacus), non solo sul dispositivo
            Promise.all([
                fetchWithRetry(counterGetUrl, 3).then(r => r.json()),
                fetchWithRetry(offsetGetUrl, 3).then(r => r.json())
            ]).then(([totalData, offsetData]) => {
                totalClicks = totalData.value || 0;
                offsetClicks = offsetData.value || 0;
                updateAdminTitle();
            }).catch(e => console.error(e));
        }
    }

    async function resetCounterGlobally() {
        const mainTitle = document.getElementById('main-title');
        mainTitle.innerText = 'Azzeramento in corso...';
        try {
            const totalData = await fetchWithRetry(counterGetUrl, 3).then(r => r.json());
            const target = totalData.value || 0;
            let offsetData = await fetchWithRetry(offsetGetUrl, 3).then(r => r.json());
            let current = offsetData.value || 0;
            while (current < target) {
                await fetchWithRetry(offsetHitUrl, 3);
                current++;
            }
            totalClicks = target;
            offsetClicks = current;
        } catch (e) {
            console.error(e);
        }
        updateAdminTitle();
    }
    
    function updateAdminTitle() {
        let val = Math.max(0, totalClicks - offsetClicks);
        document.getElementById('main-title').innerText = `Rosticcerie (${val.toLocaleString('it-IT')})`;
    }

    function openDetail(element) {
        document.getElementById('grid-view').style.display = 'none';
        
        const detailView = document.getElementById('detail-view');
        detailView.innerHTML = element.innerHTML;
        detailView.style.display = 'block';
        
        const title = element.getAttribute('data-title');
        document.getElementById('main-title').innerText = title;
        
        document.getElementById('main-footer').style.display = 'block';
        window.scrollTo(0, 0);
        
        if (!isAdmin) {
            fetchWithRetry(counterHitUrl, 3).catch(e => {});
        }
    }

    function closeDetail() {
        document.getElementById('detail-view').style.display = 'none';
        document.getElementById('detail-view').innerHTML = '';
        document.getElementById('grid-view').style.display = 'grid';
        
        const mainTitle = document.getElementById('main-title');
        if (isAdmin) {
            updateAdminTitle();
        } else {
            mainTitle.innerText = 'Rosticcerie';
        }
        
        document.getElementById('main-footer').style.display = 'none';
        window.scrollTo(0, 0);
    }
    
    function handleTitleClick() {
        if (isAdmin && document.getElementById('grid-view').style.display !== 'none') {
            if (confirm("Vuoi davvero azzerare il contatore? (Verra' azzerato per tutti i dispositivi)")) {
                resetCounterGlobally();
            }
        }
    }
    
    window.onload = loadCounter;
  </script>
</head>
<body>
  <header id="main-header">
    <h1 id="main-title" onclick="handleTitleClick()">Rosticcerie</h1>
    <p id="main-updated" class="updated">Aggiornato: 04/09/2026 08:23</p>
  </header>
  
  <main id="grid-view">
    
        <section class="card" data-title="Fantasia" onclick="openDetail(this)">
            <h2>Fantasia</h2>
            
            <div class="card-detail-content">
                <a href="tel:0804054139"><img src="Fantasia_call.jpg?v=1788510204" alt="Fantasia"></a>
            </div>
            
        </section>
        
        <section class="card" data-title="Cibarìa" onclick="openDetail(this)">
            <h2>Cibarìa</h2>
            
            <div class="card-detail-content">
                <a href="tel:0806450799"><img src="Cibaria_call.jpg?v=1788510204" alt="Cibarìa"></a>
            </div>
            
        </section>
        
        <section class="card" data-title="Impastamò" onclick="openDetail(this)">
            <h2>Impastamò</h2>
            
            <div class="card-detail-content">
                <a href="tel:3925361536"><img src="Impastamo_call.jpg?v=1788510204" alt="Impastamò"></a>
            </div>
            
        </section>
        
        <section class="card" data-title="Le delizie di Michela" onclick="openDetail(this)">
            <h2>Le delizie di Michela</h2>
            
            <div class="card-detail-content">
                <a href="tel:0805212233"><img src="Le_delizie_di_Michela_call.jpg?v=1788510204" alt="Le delizie di Michela"></a>
            </div>
            
        </section>
        
        <section class="card" data-title="Santoro (Castellana)" onclick="openDetail(this)">
            <h2>Santoro (Castellana)</h2>
            
            <div class="card-detail-content">
                <a href="tel:0808598313"><img src="Santoro__Castellana_call.jpg?v=1788510204" alt="Santoro (Castellana)"></a>
            </div>
            
        </section>
        
        <section class="card" data-title="Pane&amp;Co" onclick="openDetail(this)">
            <h2>Pane&amp;Co</h2>
            
            <div class="card-detail-content">
                <a href="tel:0804054900"><img src="Pane_Co_call.jpg?v=1788510204" alt="Pane&amp;Co"></a>
            </div>
            
        </section>
        
        <section class="card" data-title="Bollenti piatti" onclick="openDetail(this)">
            <h2>Bollenti piatti</h2>
            <div class="card-detail-content"><p class="error">Non ho trovato nessun post testuale del menu nella pagina Facebook: https://www.facebook.com/BollentiPiatti</p></div>
        </section>
        
  </main>
  
  <div id="detail-view"></div>
  
  <footer id="main-footer" onclick="closeDetail()">
    <h1>Home</h1>
  </footer>
</body>
</html>
