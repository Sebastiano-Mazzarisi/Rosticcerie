name: Rosticcerie iOS

permissions:
  contents: write

on:
  push:
    paths:
      - '.github/workflows/rosticceria-ios.yml'
      - 'Rosticceria.py'
      - 'Rosticceria_legacy.py'
      - 'rosticcerie_clean/**'
      - 'requirements.txt'
      - 'local_menus/**'
  schedule:
    # GitHub Actions usa UTC. Scheduliamo una finestra UTC ampia che copre
    # sia ora solare sia ora legale italiana, poi lo step Python sotto decide
    # con Europe/Rome se e' davvero il momento di estrarre.
    # 00:01 Italia: ricalcola subito la data di riferimento e rende grigi i
    # menu ancora riferiti al giorno precedente.
    - cron: '1 22,23 * * *'
    # 05:00-20:00 Italia: rilettura ogni 10 minuti (estate e inverno).
    - cron: '*/10 3-19 * * *'
  workflow_dispatch:

concurrency:
  group: rosticcerie-ios
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Controlla fascia oraria italiana
        id: timecheck
        shell: python
        run: |
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Europe/Rome"))
          midnight_refresh = now.hour == 0 and now.minute < 15
          scheduled_refresh = (5 <= now.hour < 20) or (now.hour == 20 and now.minute < 10)
          manual = os.environ.get("GITHUB_EVENT_NAME") in {"workflow_dispatch", "push"}

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run={str(midnight_refresh or scheduled_refresh or manual).lower()}\n")
              output.write(f"rome_time={now:%Y-%m-%d %H:%M:%S %Z}\n")

      - name: Checkout
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Configura Python
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installa dipendenze
        if: steps.timecheck.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Crea cookies.txt se presente
        if: steps.timecheck.outputs.run == 'true'
        env:
          FACEBOOK_COOKIES: ${{ secrets.FACEBOOK_COOKIES }}
        run: |
          if [ -z "$FACEBOOK_COOKIES" ]; then
            echo "Secret FACEBOOK_COOKIES non presente: provo senza cookie."
          else
            printf '%s' "$FACEBOOK_COOKIES" > cookies.txt
          fi

      - name: Estrai foto
        if: steps.timecheck.outputs.run == 'true'
        run: python Rosticceria.py --once --no-git

      - name: Stampa diagnostica HTML Facebook (se presente)
        if: steps.timecheck.outputs.run == 'true'
        shell: bash
        run: |
          echo "===== FILE DEBUG ====="
          ls -lh error_* 2>/dev/null || echo "Nessun file di debug presente."

          echo "===== TESTO HTML (prime 200 righe per file) ====="
          for f in error_*.html; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            sed -n '1,200p' "$f"
          done

      - name: Carica diagnostica errori Facebook (se presente)
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: facebook-debug
          path: |
            debug_*.png
            error_*.png
            error_*.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Assicura icona Home
        if: steps.timecheck.outputs.run == 'true'
        run: |
          if [ ! -f output/rosticceria_ios/apple-touch-icon.png ]; then
            curl -sL "https://raw.githubusercontent.com/Sebastiano-Mazzarisi/Prog/main/Fantasia/output/rosticceria_ios/apple-touch-icon.png" -o output/rosticceria_ios/apple-touch-icon.png
            echo "Icona Home scaricata."
          fi

      - name: Commit immagini aggiornate
        if: steps.timecheck.outputs.run == 'true'
        run: |
          git config user.name "Rosticcerie Bot"
          git config user.email "actions@github.com"
          git add output/rosticceria_ios
          if git diff --staged --quiet; then
            echo "Nessuna modifica da salvare"
          else
            git commit -m "Aggiorna foto rosticcerie"
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "Push rifiutato (probabile collisione con un altro commit su main), riprovo dopo un rebase..."
              # I file in output/rosticceria_ios sono generati da questa
              # esecuzione: salvali prima di riallineare il branch remoto,
              # altrimenti il rebase puo' entrare in conflitto proprio su
              # Rosticcerie.html/index.html/status.json.
              rm -rf /tmp/rosticcerie-ios-generated
              mkdir -p /tmp/rosticcerie-ios-generated
              cp -a output/rosticceria_ios/. /tmp/rosticcerie-ios-generated/
              git fetch origin main
              git reset --hard origin/main
              cp -a /tmp/rosticcerie-ios-generated/. output/rosticceria_ios/
              git add output/rosticceria_ios
              git commit -m "Aggiorna foto rosticcerie" || true
              sleep 3
            done
          fi
